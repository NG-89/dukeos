# DukeOS boot switcher (Batocera side) - /userdata/system/dukeos-switcher.conf
# Leave BAZZITE_BOOTNUM empty to auto-detect by label, or pin it after checking:
#   bash /userdata/roms/ports/Boot-to-Bazzite.sh status
BAZZITE_BOOTNUM=""
BAZZITE_LABEL_REGEX="^(bazzite|fedora)"
BAZZITE_LOADER_REGEX="efi.fedora.shimx64"
# 1 = only log what would happen (no BootNext, no reboot). Start with 1 to test.
DUKEOS_SWITCH_DRY_RUN=1
